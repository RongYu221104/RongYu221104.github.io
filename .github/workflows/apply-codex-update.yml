name: Apply Codex update package

on:
  push:
    branches:
      - codex/publish-tools-20260730
    paths:
      - .codex-update.zip.b64

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply packaged repository changes
        shell: bash
        run: |
          base64 --decode .codex-update.zip.b64 > /tmp/codex-update.zip
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          with ZipFile("/tmp/codex-update.zip") as archive:
              archive.extractall(".")

          for path in (
              Path("public/apps/ryplan/index.html"),
              Path("src/pages/tools/ryplan.astro"),
              Path(".codex-update.zip.b64"),
              Path(".github/workflows/apply-codex-update.yml"),
          ):
              path.unlink(missing_ok=True)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: publish document tools and refine player"
          git push origin HEAD
